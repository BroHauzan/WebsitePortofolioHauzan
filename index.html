    <!-- Google Fonts: Fraunces, Instrument Serif, Geist -->
    <!-- 'Inter' sengaja TIDAK dimuat: stack Tailwind (tailwind.config.js) dan global.css
         memakai 'Geist' lebih dulu, jadi Inter tidak pernah dipakai di halaman ini. -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <!-- Preload 1 file woff2 yang benar-benar dirender di atas fold: H1 Hero "Hauzan"
         memakai `.font-display` (global.css -> Fraunces normal) dan sub-heading Hero juga
         Fraunces normal 300..800, subset latin (unicode-range U+0000-00FF dst, cukup untuk
         teks latin/Indonesia). URL diambil langsung dari respons fonts.googleapis.com untuk
         query stylesheet di bawah (bukan dikarang), diverifikasi live: HTTP 200,
         content-type font/woff2, 67.304 byte, byte-range 206 OK. crossorigin wajib ada agar
         preload cocok dengan fetch font oleh CSS (font selalu di-fetch dalam mode CORS).
         Catatan: URL gstatic ini ter-version (v38); bila Google merilis versi baru, preload
         gagal-match dan browser sekadar mengabaikannya (fallback aman, tanpa error). -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/fraunces/v38/6NU58FyLNQOQZAnv9ZwNjucMHVn85Ni7emAe9lKqZTnbB-gzTK0K1ChjeveQ.woff2" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..800;1,9..144,300..800&amp;family=Geist:wght@300;400;500;600;700&amp;family=Instrument+Serif:ital@0;1&amp;display=swap" rel="stylesheet" />

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        # NOTE: `enablement: true` sengaja TIDAK dipakai. POST
        # /repos/{owner}/{repo}/pages membutuhkan hak admin; GITHUB_TOKEN
        # hanya punya scope org/repo biasa, sehingga action selalu gagal
        # dengan "Resource not accessible by integration".
        # Pages harus diaktifkan manual sekali lewat UI GitHub:
        #   Settings → Pages → Build and deployment → Source = GitHub Actions
        # Setelah itu workflow cukup upload artifact dan deploy.
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
